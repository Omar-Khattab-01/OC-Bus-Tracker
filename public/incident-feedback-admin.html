<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Feedback Incident Manager</title>
  <style>
    :root{color-scheme:dark;--bg:#0d1117;--panel:#151b23;--line:#303a47;--text:#f3f6fa;--muted:#a8b3c1;--red:#da291c;--amber:#ffb348;--green:#53d28c}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 10% 0,rgba(218,41,28,.18),transparent 30%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(1180px,calc(100% - 32px));margin:auto;padding:28px 0 60px} header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px} h1{margin:0;font-size:clamp(30px,5vw,48px);line-height:1} p{color:var(--muted);line-height:1.5} a{color:#a9c9ff;text-decoration:none}
    .panel,.entry,.empty{border:1px solid var(--line);background:rgba(21,27,35,.96);border-radius:14px;padding:16px}.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:18px}.filters .search-field{grid-column:span 2}
    input,select,textarea,button{border-radius:10px;border:1px solid var(--line);padding:11px 13px;font:inherit}input,select,textarea{background:#0d1117;color:var(--text);min-width:0}button{border-color:var(--red);background:var(--red);color:white;font-weight:800;cursor:pointer}button.secondary{background:#202936;border-color:var(--line)}button.success{background:#137a49;border-color:#23965f}button.danger{background:#4b1717;border-color:#8c2929}button:disabled{opacity:.55;cursor:wait}
    #status{min-height:20px;color:var(--muted);font-size:13px;margin-bottom:12px}.summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.summary span,.badge{border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--muted);font-size:12px}.badge{display:inline-block;color:var(--amber);border-color:rgba(255,179,72,.35);text-transform:uppercase}.badge.resolved{color:var(--green);border-color:rgba(83,210,140,.35)}
    #log{display:grid;gap:12px}.entry.resolved{opacity:.78}.entry-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}.entry h2{margin:6px 0 0;font-size:20px}.time{color:var(--muted);font-size:13px}.numbers{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.number{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#0f141b}.number span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.number strong{display:block;margin-top:3px;font-size:21px}.wrong strong{color:#ff8989}.correct strong{color:#75dda5}.comment{white-space:pre-wrap}.details{margin-top:12px;color:var(--muted);font-size:13px;line-height:1.5}.evidence{margin-top:12px;border:1px solid var(--line);border-radius:10px;background:#0b1016}.evidence summary{padding:10px 12px;cursor:pointer;color:#a9c9ff;font-weight:700}.evidence pre{margin:0;padding:12px;border-top:1px solid var(--line);overflow:auto;max-height:420px;color:#cbd5e1;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{padding:8px 11px;font-size:13px}.edit-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.edit-form textarea{grid-column:1/-1;resize:vertical}.edit-form .actions{grid-column:1/-1;margin:0}
    [hidden]{display:none!important}@media(max-width:760px){.filters,.edit-form{grid-template-columns:1fr}.filters .search-field,.edit-form textarea,.edit-form .actions{grid-column:1}.filters button{width:100%}}
  </style>
</head>
<body><main>
  <header><div><h1>Feedback Incidents</h1><p>Private dashboard for investigating live lookup reports.</p></div><a href="/">Back to tracker</a></header>
  <div id="status" role="status" aria-live="polite">Checking account access…</div>
  <section id="manager" hidden>
    <form id="filterForm" class="panel filters">
      <input id="search" class="search-field" type="search" placeholder="Search bus, paddle, location or comment" aria-label="Search reports">
      <select id="statusFilter" aria-label="Status"><option value="">All statuses</option><option value="open">Open</option><option value="resolved">Resolved</option></select>
      <select id="issueFilter" aria-label="Issue type"><option value="">All issue types</option><option value="incorrect_bus_number">Incorrect bus number</option><option value="wrong_bus_location">Wrong bus location</option><option value="wrong_paddle_information">Wrong paddle information</option></select>
      <select id="lookupFilter" aria-label="Lookup type"><option value="">All lookups</option><option value="block">Paddle</option><option value="bus">Bus</option></select>
      <select id="datePreset" aria-label="Report date"><option value="">All dates</option><option value="today">Today</option><option value="yesterday">Yesterday</option><option value="range">Custom range</option></select>
      <input id="fromDate" type="date" aria-label="Start date" hidden>
      <input id="toDate" type="date" aria-label="End date" hidden>
      <button type="submit">Apply Filters</button>
    </form>
    <div id="summary" class="summary"></div><section id="log" aria-live="polite"></section>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const ownerEmail='omar.hosam2000@gmail.com';
  const statusEl=document.getElementById('status'),managerEl=document.getElementById('manager'),filterForm=document.getElementById('filterForm'),logEl=document.getElementById('log'),summaryEl=document.getElementById('summary');
  const issueLabels={incorrect_bus_number:'Incorrect bus number',wrong_bus_location:'Wrong bus location',wrong_paddle_information:'Wrong paddle information'};
  let supabaseClient=null,currentSession=null,feedbackItems=[];
  const escapeHtml=(v)=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  const fmt=(v)=>v?new Date(v).toLocaleString():'Unknown time';

  function renderEntry(item){const resolved=(item.status||'open')==='resolved';return `<article class="entry${resolved?' resolved':''}" data-entry-id="${item.id}">
    <div class="entry-head"><div><span class="badge${resolved?' resolved':''}">${escapeHtml(resolved?'Resolved':issueLabels[item.issue_type]||'Open feedback')}</span><h2>${item.lookup_type==='bus'?'Bus':'Paddle'} lookup: ${escapeHtml(item.lookup_value)}</h2></div><time class="time">Reported ${escapeHtml(fmt(item.lookup_generated_at||item.created_at))}</time></div>
    <div class="numbers"><div class="number wrong"><span>Site showed</span><strong>${escapeHtml(item.reported_bus_number)}</strong></div><div class="number correct"><span>Correct bus</span><strong>${escapeHtml(item.correct_bus_number||'Not provided')}</strong></div></div>
    <div class="comment">${escapeHtml(item.comment||'No comment provided.')}</div><div class="details">${item.block?`Block: ${escapeHtml(item.block)} · `:''}${item.location_text?`Location: ${escapeHtml(item.location_text)} · `:''}Bus information sent: ${escapeHtml(fmt(item.lookup_generated_at||item.created_at))} · Report submitted: ${escapeHtml(fmt(item.created_at))}${item.resolved_at?` · Resolved: ${escapeHtml(fmt(item.resolved_at))}`:''}</div>
    <details class="evidence"><summary>Review GTFS feed evidence${item.realtime_evidence?.capturedAt?` · ${escapeHtml(fmt(item.realtime_evidence.capturedAt))}`:''}</summary><pre>${escapeHtml(JSON.stringify(item.realtime_evidence||{message:'No feed evidence was captured for this older report.'},null,2))}</pre></details>
    <div class="actions"><button class="${resolved?'secondary':'success'}" type="button" data-action="toggle">${resolved?'Reopen':'Mark Resolved'}</button><button class="secondary" type="button" data-action="edit">Edit</button><button class="danger" type="button" data-action="delete">Delete</button></div>
    <form class="edit-form" data-edit-form hidden><select name="issueType"><option value="">No issue selected</option>${Object.entries(issueLabels).map(([v,l])=>`<option value="${v}"${item.issue_type===v?' selected':''}>${l}</option>`).join('')}</select><input name="correctBusNumber" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" value="${escapeHtml(item.correct_bus_number||'')}" placeholder="Correct bus number"><textarea name="comment" rows="4" maxlength="2000" placeholder="Comment">${escapeHtml(item.comment||'')}</textarea><div class="actions"><button type="submit">Save Changes</button><button class="secondary" type="button" data-action="cancel">Cancel</button></div></form>
  </article>`}

  async function api(path,options={}){const token=currentSession?.access_token;if(!token)throw new Error('Please sign in again.');const response=await fetch(path,{...options,headers:{Authorization:`Bearer ${token}`,...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const result=await response.json().catch(()=>({}));if(!response.ok||!result.ok)throw new Error(result.error||'Request failed.');return result}
  async function loadFeedback(){statusEl.textContent='Loading reports…';const params=new URLSearchParams({limit:'250'});const values={search:document.getElementById('search').value.trim(),status:document.getElementById('statusFilter').value,issueType:document.getElementById('issueFilter').value,lookupType:document.getElementById('lookupFilter').value,datePreset:document.getElementById('datePreset').value,fromDate:document.getElementById('fromDate').value,toDate:document.getElementById('toDate').value};Object.entries(values).forEach(([k,v])=>{if(v)params.set(k,v)});const result=await api(`/api/admin/live-lookup-feedback?${params}`);feedbackItems=result.feedback||[];logEl.innerHTML=feedbackItems.length?feedbackItems.map(renderEntry).join(''):'<div class="empty">No reports match these filters.</div>';const open=feedbackItems.filter(x=>(x.status||'open')==='open').length;summaryEl.innerHTML=`<span>${feedbackItems.length} shown</span><span>${open} open</span><span>${feedbackItems.length-open} resolved</span>`;statusEl.textContent=`Loaded for ${ownerEmail}.`;managerEl.hidden=false}
  filterForm.addEventListener('submit',e=>{e.preventDefault();loadFeedback().catch(err=>statusEl.textContent=err.message)});
  document.getElementById('datePreset').addEventListener('change',e=>{const show=e.target.value==='range';document.getElementById('fromDate').hidden=!show;document.getElementById('toDate').hidden=!show;if(!show){document.getElementById('fromDate').value='';document.getElementById('toDate').value=''}});
  logEl.addEventListener('click',async e=>{const button=e.target.closest('[data-action]');if(!button)return;const entry=button.closest('[data-entry-id]'),id=entry?.dataset.entryId,item=feedbackItems.find(x=>x.id===id);if(!item)return;const action=button.dataset.action;if(action==='edit'){entry.querySelector('[data-edit-form]').hidden=false;return}if(action==='cancel'){entry.querySelector('[data-edit-form]').hidden=true;return}if(action==='delete'){if(!confirm('Delete this feedback report permanently?'))return;try{await api(`/api/admin/live-lookup-feedback/${id}`,{method:'DELETE'});await loadFeedback()}catch(err){statusEl.textContent=err.message}return}if(action==='toggle'){try{await api(`/api/admin/live-lookup-feedback/${id}`,{method:'PATCH',body:JSON.stringify({status:(item.status||'open')==='resolved'?'open':'resolved'})});await loadFeedback()}catch(err){statusEl.textContent=err.message}}});
  logEl.addEventListener('submit',async e=>{const form=e.target.closest('[data-edit-form]');if(!form)return;e.preventDefault();const id=form.closest('[data-entry-id]').dataset.entryId;const fields=new FormData(form);try{await api(`/api/admin/live-lookup-feedback/${id}`,{method:'PATCH',body:JSON.stringify({issueType:fields.get('issueType'),correctBusNumber:fields.get('correctBusNumber'),comment:fields.get('comment')})});await loadFeedback()}catch(err){statusEl.textContent=err.message}});
  async function initialize(){try{const response=await fetch('/api/supabase-config'),config=await response.json();if(!config.enabled||!window.supabase){window.location.replace('/');return}supabaseClient=window.supabase.createClient(config.url,config.anonKey);const {data}=await supabaseClient.auth.getSession();currentSession=data.session;if(currentSession?.user?.email?.toLowerCase()!==ownerEmail){window.location.replace('/');return}supabaseClient.auth.onAuthStateChange((_event,session)=>{if(!session||session.user?.email?.toLowerCase()!==ownerEmail)window.location.replace('/')});await loadFeedback()}catch(_error){window.location.replace('/')}}
  initialize();
</script></body></html>
